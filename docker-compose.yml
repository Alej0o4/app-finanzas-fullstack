services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oikos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: oikos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oikos"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oikos:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}@postgres:5432/oikos
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY en .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://alejo-yoga-6-13alc6.tail44159c.ts.net}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_TAILSCALE_CORS: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://100.76.235.30:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@oikos.app}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  backup:
    build: ./scripts/backup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-oikos-crypt:oikos-backups}
      BACKUP_MIN_INTERVAL_HOURS: ${BACKUP_MIN_INTERVAL_HOURS:-20}
      BACKUP_RETENTION_DAYS_LOCAL: ${BACKUP_RETENTION_DAYS_LOCAL:-7}
      BACKUP_RETENTION_DAYS_REMOTE: ${BACKUP_RETENTION_DAYS_REMOTE:-30}
    volumes:
      - ./backups:/backups
      - ${RCLONE_CONFIG_PATH:-./rclone.conf}:/config/rclone.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://alejo-yoga-6-13alc6.tail44159c.ts.net}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
